name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and macOS build on the plain runner here for fast feedback. The release workflow
          # deliberately differs: it builds Linux inside Debian 11 for an old glibc baseline, and
          # builds macOS twice for a universal binary. Neither changes the code under test.
          - { name: Linux (gcc),      os: ubuntu-latest  }
          # macos-15 rather than macos-latest, so CI runs on the macOS the release builds from
          - { name: macOS (clang),    os: macos-15       }
          # Windows must NOT differ: the runner image is the one the release workflow ships from, so
          # CI compiles the configuration users actually download.
          - { name: Windows (MSVC),   os: windows-2022   }

    # bash everywhere, so all three platforms run byte-identical commands. The Windows default is
    # PowerShell, which splits an unquoted -DFOO=path/file.ext at the dot into two arguments, so
    # cmake received "-DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain" and a stray ".cmake".
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install conan
        run: pip install "conan>=2"

      - name: Cache conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.os }}-${{ hashFiles('conanfile.py') }}

      - name: Configure conan
        run: conan profile detect --force

      - name: Install dependencies
        run: conan install . --output-folder build --build=missing -s build_type=Release

      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # The roundtrip subcommand is the project's own correctness check: binary -> JSON -> binary
      # has to be byte-identical. The same script gates the release builds.
      - name: Smoke test
        run: |
          BIN=build/TransceiverTool
          [ -f "$BIN" ] || BIN=build/Release/TransceiverTool.exe
          sh .github/smoke-test.sh "$BIN"

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned to the exact version used locally. clang-format's output changes between releases, so
      # an unpinned apt package formats differently and fails this check on a correctly formatted tree.
      - name: Install clang-format
        run: pip install "clang-format==22.1.8"

      - name: Check formatting
        run: |
          clang-format --version
          # Checks that the tree is at a fixed point. clang-format is not always idempotent in a
          # single pass, so a freshly formatted file can still need a second pass; the hook and the
          # local workflow both run it twice.
          clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')
